<!DOCTYPE html>
<html lang="en">
<head>
  <title>Organizer Signup</title>
  <link rel="stylesheet" href="style2.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="background-image">
    <div class="signup-box">
      <h1>Event Organizer Sign Up</h1>
      <form action="organizer_signup.php" method="post">
        <div class="form-row">
          <div class="half">
            <label>First Name</label>
            <input type="text" name="fname" placeholder="First Name" />
          </div>
          <div class="half">
            <label>Last Name</label>
            <input type="text" name="lname" placeholder="Last Name" />
          </div>
        </div>
        <div class="form-row">
          <div class="half">
            <label>Email</label>
            <input type="email" name="mail" placeholder="Email" />
          </div>
          <div class="half">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Phone Number" />
          </div>
        </div>
        <div class="form-row">
          <div class="half">
            <label>Password</label>
            <input type="password" name="pass" placeholder="Password" />
          </div>
          <div class="half">
            <label>Confirm Password</label>
            <input type="password" name="cpass" placeholder="Confirm Password" />
          </div>
        </div>
        <label>Address</label>
        <div class="address-fields">
          <input type="text" name="hn" placeholder="House No" />
          <input type="text" name="rn" placeholder="Road No" />
          <input type="text" name="city" placeholder="City" />
        </div>
        <input type="submit" value="Submit" />
      </form>
      <p>
        By clicking the Sign Up button, you agree to our <br />
        <a href="#">Terms and Condition</a> and <a href="#">Policy Privacy</a>
      </p>
      <p class="para-2">
        Already have an account? <a href="organizer_sign_in.html">Login here</a>
      </p>
    </div>a
  </div>a
</body>
</html>
